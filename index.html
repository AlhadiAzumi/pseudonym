<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudonym Intro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Container Utama Intro */
        .intro-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Logo 1: Tanda Tanya (Mulai) */
        .logo-question {
            position: absolute;
            width: 150px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(173, 255, 47, 0.6));
            animation: 
                fadeInOut 2.0s ease-in-out forwards,
                pulse 1.5s infinite alternate ease-in-out;
        }

        /* Logo 2: Teks PSNYM (Reveal) */
        .logo-text {
            position: absolute;
            width: 250px;
            height: auto;
            opacity: 0;
            transform: scale(0.8);
            filter: drop-shadow(0 0 15px rgba(173, 255, 47, 0.8));
            animation: revealText 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.8s forwards;
        }

        /* --- KEYFRAMES ANIMASI --- */
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            15% {
                opacity: 1;
                transform: scale(1);
            }
            75% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: drop-shadow(0 0 10px rgba(173, 255, 47, 0.6));
            }
            88% {
                opacity: 0.9;
                transform: scale(1.1) skewX(-15deg);
                filter: drop-shadow(0 0 25px rgba(173, 255, 47, 1)) invert(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.3) rotate(10deg);
            }
        }

        @keyframes pulse {
            0% {
                filter: drop-shadow(0 0 8px rgba(173, 255, 47, 0.5));
            }
            100% {
                filter: drop-shadow(0 0 22px rgba(173, 255, 47, 0.95));
            }
        }

        @keyframes revealText {
            0% {
                opacity: 0;
                transform: scale(0.7);
                filter: blur(8px) drop-shadow(0 0 5px rgba(173, 255, 47, 0.5));
            }
            30% {
                opacity: 1;
                transform: scale(1.05);
                filter: blur(0px) drop-shadow(0 0 25px rgba(173, 255, 47, 1));
            }
            50% {
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: drop-shadow(0 0 14px rgba(173, 255, 47, 0.8));
            }
        }
    </style>
</head>
<body>

    <div class="intro-container">
        <img class="logo-question" src="/assets/images/Pseudonym%20logo%20browser.png" alt="Question">
        <img class="logo-text" src="/assets/images/Pseudonym%20logo.png" alt="PSNYM">
    </div>

    <script>
        setTimeout(function() {
            window.location.href = 'index.php';
        }, 4000);
    </script>
</body>
</html>
